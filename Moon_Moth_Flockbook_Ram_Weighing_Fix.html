let animals=DATA.animals.map((a,i)=>({...a,_i:i}));
const key='mmf-flockbook-events-v2';
let events=DATA.events.slice();
try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(Array.isArray(saved))events=saved}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=x=>x===null||x===undefined||x===''?'—':esc(x);
const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function persist(){try{localStorage.setItem(key,JSON.stringify(events));return true}catch(e){alert('Browser storage is unavailable. Please export your data before continuing.');return false}}
function activeAnimals(){return animals.filter(a=>a.Status==='Active')}
function go(view){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(view).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.nav===view));window.scrollTo(0,0)}
function latestWeight(rfid){return events.filter(e=>e.RFID===rfid&&e['Event Type']==='Weight'&&e.Amount!==''&&e.Amount!=null).sort((a,b)=>String(b['Event Date']).localeCompare(String(a['Event Date'])))[0]}
function renderHome(){let aa=activeAnimals(),weights=events.filter(e=>e['Event Type']==='Weight'&&e['Event Date']===today()).length; $('home').innerHTML=`<div class="hero"><div class="eyebrow">Farm records · 2026</div><h2>Your flock, thoughtfully tracked.</h2><p>A calm, practical home for your sheep records — built for barn boots, busy days and quick checks in the field.</p></div><div class="grid"><button class="tile" onclick="go('weigh');renderWeigh()"><div class="ico">⚖️</div><b>Weighing session</b><span>Enter today's ram weights quickly</span></button><button class="tile" onclick="go('animals');renderAnimals()"><div class="ico">🐑</div><b>Find a sheep</b><span>Search by name or RFID</span></button><button class="tile" onclick="openAdd()"><div class="ico">＋</div><b>Record an event</b><span>Health, breeding, notes and more</span></button><button class="tile" onclick="exportCSV()"><div class="ico">⇩</div><b>Export records</b><span>Download your saved event data</span></button></div><div class="section"><h3>At a glance</h3><span class="muted" style="font-size:12px">Master dataset v16</span></div><div class="grid"><div class="stat"><strong>${aa.length}</strong><span>Active sheep</span></div><div class="stat"><strong>${aa.filter(a=>a.Sex==='M').length}</strong><span>Active males</span></div><div class="stat"><strong>${weights}</strong><span>Weights today</span></div><div class="stat"><strong>${events.filter(e=>e['Event Type']==='Weight').length}</strong><span>Weight records</span></div></div><p class="notice">Your new entries save on this device in this browser. Use Export regularly. This test app does not change the master spreadsheet or sync across devices.</p>`}
let weighFilter='males';
function renderWeigh(){let q=($('weighSearch')?.value||'').toLowerCase();let candidates=weighFilter==='males'?animals.filter(a=>(a.Sex==='M'||a.Sex==='Male')&&a.Status!=='Deceased'):activeAnimals().filter(a=>weighFilter==='all'||(weighFilter==='females'&&(a.Sex==='F'||a.Sex==='Female')));let list=candidates.filter(a=>[a.Name,a.RFID,a['Farm Tag'],a.Notes].join(' ').toLowerCase().includes(q));let countToday=events.filter(e=>e['Event Type']==='Weight'&&e['Event Date']===($('weighDate')?.value||today())).length; $('weigh').innerHTML=`<div class="section"><h3>Weighing session</h3><span class="muted" style="font-size:12px">Kilograms (kg)</span></div><div class="panel"><div class="field" style="margin-top:0"><label>Weighing date</label><input id="weighDate" type="date" value="${esc($('weighDate')?.value||today())}" onchange="renderWeigh()"></div><input id="weighSearch" class="search" placeholder="Search name, RFID or farm tag…" value="${esc($('weighSearch')?.value||'')}" oninput="renderWeigh()"><div class="chips">${[['males','Rams & ram lambs'],['females','Ewes & ewe lambs'],['all','All active sheep']].map(([k,l])=>`<button class="chip ${weighFilter===k?'active':''}" onclick="weighFilter='${k}';renderWeigh()">${l}</button>`).join('')}</div><div class="pill-note">Tap a weight box, enter the scale reading in kg, and press Save weights. You can save a few animals at a time. Existing saved weights are shown as a reference.</div><div class="section"><h3>Animals</h3><span class="muted" style="font-size:12px">${list.length} shown · ${countToday} saved for date</span></div><div id="weightRows">${list.map(a=>{let last=latestWeight(a.RFID);let existing=events.find(e=>e.RFID===a.RFID&&e['Event Type']==='Weight'&&e['Event Date']===( $('weighDate')?.value||today()));return `<div class="weight-row"><div><div class="w-name">${esc(a.Name||'Unnamed animal')}</div><div class="w-id">RFID ${esc(a.RFID)}${a['Farm Tag']?' · Tag '+esc(a['Farm Tag']):''}</div><div class="w-id">${last?'Last: '+esc(last.Amount)+' kg · '+esc(last['Event Date']):'No previous weight recorded'}</div></div><div><input class="weight-input" type="number" inputmode="decimal" min="0" max="300" step="0.1" placeholder="kg" aria-label="Weight in kilograms for ${esc(a.Name||a.RFID)}" data-rfid="${esc(a.RFID)}" value="${existing?esc(existing.Amount):''}"><div class="weight-saved" id="saved-${esc(a.RFID)}">${existing?'Saved for date':''}</div></div></div>`}).join('')||'<div class="empty">No sheep match this filter.</div>'}</div><div class="toolbar" style="margin-top:15px"><button class="primary" onclick="saveWeights()">Save weights</button><button class="secondary" onclick="exportWeights()">Export weights CSV</button></div></div><p class="notice">Saved records stay in this browser on this device. After saving, export a CSV as a backup. Do not clear browser data before exporting.</p>`}
function saveWeights(){let date=$('weighDate').value||today();let inputs=[...document.querySelectorAll('.weight-input')];let changed=0;for(const inp of inputs){let raw=inp.value.trim();if(!raw)continue;let amount=Number(raw);if(!Number.isFinite(amount)||amount<=0||amount>300){alert('Please check the weight for RFID '+inp.dataset.rfid+'. Enter a weight in kg greater than 0 and no more than 300.');inp.focus();return}let old=events.find(e=>e.RFID===inp.dataset.rfid&&e['Event Type']==='Weight'&&e['Event Date']===date);if(old){old.Amount=String(amount);old.Details=amount+' kg';old.Notes='Entered in weighing session';old.Status='Completed'}else{events.push({'Event ID':'LOCAL-WEIGHT-'+Date.now()+'-'+inp.dataset.rfid,RFID:inp.dataset.rfid,'Event Type':'Weight','Event Date':date,Status:'Completed',Amount:String(amount),'Buyer/Party':'',Details:amount+' kg',Notes:'Entered in weighing session'})}changed++}if(!changed){alert('Enter at least one weight before saving.');return}if(persist()){renderWeigh();renderHome();alert(changed+' weight record(s) saved on this device. Please export a backup when you finish.')}}
function csv(rows){let s=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let blob=new Blob(['\ufeff'+s],{type:'text/csv;charset=utf-8;'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='Moon_Moth_Farm_'+today()+'_weights.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportWeights(){let rows=[['Date','RFID','Name','Weight kg','Notes']];events.filter(e=>e['Event Type']==='Weight').sort((a,b)=>String(a['Event Date']).localeCompare(String(b['Event Date']))).forEach(e=>{let a=animals.find(x=>x.RFID===e.RFID);rows.push([e['Event Date'],e.RFID,a?.Name||'',e.Amount,e.Notes||''])});csv(rows)}
function exportCSV(){let rows=[['Event ID','RFID','Event Type','Event Date','Status','Amount','Buyer/Party','Details','Notes']];events.forEach(e=>rows.push(['Event ID','RFID','Event Type','Event Date','Status','Amount','Buyer/Party','Details','Notes'].map(k=>e[k]??'')));csv(rows)}
let animalFilter='active';
function animalCard(a){return `<button class="animal-card" onclick="showAnimal('${esc(a.RFID)}')"><div><div class="animal-name">${esc(a.Name||('Unnamed '+a.RFID))}</div><div class="rfid">${esc(a.RFID)} · ${val(a.DOB)}</div></div><span class="badge">${a.Sex==='F'?'Ewe':'Ram/lamb'}</span></button>`}
function renderAnimals(){let q=$('animalSearch')?.value?.toLowerCase()||'';let list=animals.filter(a=>{let t=[a.Name,a.RFID,a['Farm Tag'],a.Breed,a.Notes].join(' ').toLowerCase();return (!q||t.includes(q))&&(animalFilter==='all'||(animalFilter==='active'&&a.Status==='Active')||(animalFilter==='deceased'&&a.Status==='Deceased')||(animalFilter==='females'&&a.Sex==='F')||(animalFilter==='males'&&a.Sex==='M'))});$('animals').innerHTML=`<div class="section"><h3>Sheep records</h3><span class="muted" style="font-size:12px">${list.length} shown</span></div><input id="animalSearch" class="search" placeholder="Search name, RFID, tag…" value="${esc(q)}" oninput="renderAnimals()"><div class="chips">${[['active','Active'],['all','All records'],['females','Ewes'],['males','Rams/lambs'],['deceased','Deceased']].map(([k,l])=>`<button class="chip ${animalFilter===k?'active':''}" onclick="animalFilter='${k}';renderAnimals()">${l}</button>`).join('')}</div>${list.map(animalCard).join('')||'<div class="empty">No sheep match that search.</div>'}`}
function showAnimal(rfid){let a=animals.find(x=>x.RFID===rfid);if(!a)return;let es=events.filter(e=>e.RFID===rfid).sort((x,y)=>String(y['Event Date']||'').localeCompare(String(x['Event Date']||'')));let w=latestWeight(rfid);$('animal').innerHTML=`<button class="secondary" onclick="go('animals');renderAnimals()">‹ Back to sheep</button><div class="panel" style="margin-top:12px"><div class="detail-head"><div class="avatar">🐑</div><div><h2>${esc(a.Name||'Unnamed animal')}</h2><div class="muted" style="font-size:12px">RFID ${esc(a.RFID)}</div><span class="badge">${esc(a.Status)}</span></div></div><div class="facts"><div class="fact"><small>Latest weight</small><b>${w?esc(w.Amount)+' kg · '+esc(w['Event Date']):'Not recorded'}</b></div><div class="fact"><small>Date of birth</small><b>${val(a.DOB)}</b></div><div class="fact"><small>Breed</small><b>${val(a.Breed)}</b></div><div class="fact"><small>Sex</small><b>${val(a.Sex)}</b></div><div class="fact"><small>Dam</small><b>${val(a.Dam)}</b></div><div class="fact"><small>Sire</small><b>${val(a.Sire)}</b></div><div class="fact"><small>Farm tag</small><b>${val(a['Farm Tag'])}</b></div><div class="fact"><small>Notes</small><b>${val(a.Notes)}</b></div></div><div class="quick"><button class="primary" onclick="go('weigh');weighFilter='all';renderWeigh();setTimeout(()=>{let i=document.querySelector('[data-rfid=\'${esc(a.RFID)}\']');if(i){i.focus();i.scrollIntoView({block:'center'})}},80)">＋ Record weight</button><button class="secondary" onclick="openAdd('${esc(a.RFID)}','Note')">＋ Note</button></div></div><div class="section"><h3>Timeline</h3></div>${es.map(e=>`<div class="event"><b>${esc(e['Event Type'])}</b><span class="muted" style="float:right;font-size:12px">${val(e['Event Date'])}</span><div style="margin-top:6px">${e['Event Type']==='Weight'?esc(e.Amount)+' kg':val(e.Details)}</div>${e.Notes?`<div class="muted" style="font-size:12px;margin-top:5px">${esc(e.Notes)}</div>`:''}</div>`).join('')||'<div class="empty">No events recorded yet.</div>'}`;go('animal')}
function openAdd(rfid='',type='Weight'){$('add').innerHTML=`<div class="section"><h3>Record an event</h3></div><div class="panel"><form id="eventForm" onsubmit="saveEvent(event)"><div class="field"><label>Animal</label><select id="fAnimal" required>${animals.map(a=>`<option value="${esc(a.RFID)}" ${a.RFID===rfid?'selected':''}>${esc(a.Name||('Unnamed '+a.RFID))} — ${esc(a.RFID)}</option>`).join('')}</select></div><div class="field"><label>Event type</label><select id="fType">${['Weight','Vaccination','Treatment','Deworming','Breeding','Lambing','Movement','Note'].map(t=>`<option ${t===type?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Date</label><input id="fDate" type="date" value="${today()}" required></div><div class="field"><label>Details</label><textarea id="fDetails" rows="3" placeholder="e.g. 54.2 kg, Glanvac 6, moved to east pasture" required></textarea></div><div class="field"><label>Notes (optional)</label><textarea id="fNotes" rows="2"></textarea></div><div class="toolbar"><button class="primary" type="submit">Save event</button><button class="secondary" type="button" onclick="go('home')">Cancel</button></div></form></div><p class="notice">Saved locally on this device only. Export records for a backup.</p>`;go('add')}
function saveEvent(ev){ev.preventDefault();let rfid=$('fAnimal').value,type=$('fType').value,details=$('fDetails').value;events.push({'Event ID':'LOCAL-'+Date.now(),RFID:rfid,'Event Type':type,'Event Date':$('fDate').value,Status:'Completed',Amount:type==='Weight'?(details.match(/[0-9]+(?:\.[0-9]+)?/)||[''])[0]:'','Buyer/Party':'',Details:details,Notes:$('fNotes').value});if(persist())showAnimal(rfid)}
function renderStats(){let aa=activeAnimals();$('stats').innerHTML=`<div class="section"><h3>Flock overview</h3></div><div class="grid"><div class="stat"><strong>${aa.length}</strong><span>Active sheep</span></div><div class="stat"><strong>${aa.filter(a=>a.Sex==='F').length}</strong><span>Females</span></div><div class="stat"><strong>${aa.filter(a=>a.Sex==='M').length}</strong><span>Males</span></div><div class="stat"><strong>${aa.filter(a=>a.DOB&&a.DOB.startsWith('2026-')).length}</strong><span>Born in 2026</span></div></div><div class="section"><h3>Data safety</h3></div><div class="panel"><p class="muted" style="line-height:1.5">This is a field-test app. Records entered here do not update the master spreadsheet and do not sync between devices. Export your data before switching browsers or clearing website data.</p><div class="toolbar"><button class="primary" onclick="exportCSV()">Export all events CSV</button><button class="secondary" onclick="exportWeights()">Export weights CSV</button></div></div>`}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{go(b.dataset.nav);if(b.dataset.nav==='animals')renderAnimals();if(b.dataset.nav==='weigh')renderWeigh();if(b.dataset.nav==='stats')renderStats()});
renderHome();
</script></body></html>
